name: Apply favorites integration

on:
  push:
    branches:
      - feature/exercise-favorites

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[favorites-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/exercise-favorites
          fetch-depth: 0

      - name: Apply favorites patch
        run: python tools/apply_favorites_patch.py

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No favorites changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/exercise_library_screen.dart
          git commit -m "Apply exercise favorites integration [favorites-applied]"
          git push origin HEAD:feature/exercise-favorites
