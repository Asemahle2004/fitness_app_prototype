name: One-time rest overflow patch

on:
  push:
    paths:
      - '.github/workflows/patch-rest-overflow.yml'
      - 'tools/patch_rest_overflow.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch rest screen
        run: python tools/patch_rest_overflow.py

      - name: Commit patch and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/live_workout_screen.dart
          git rm tools/patch_rest_overflow.py .github/workflows/patch-rest-overflow.yml
          git commit -m "Fix live workout rest screen overflow"
          git push
