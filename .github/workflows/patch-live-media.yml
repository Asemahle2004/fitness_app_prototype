name: One-time universal live media patch

on:
  push:
    paths:
      - '.github/workflows/patch-live-media.yml'
      - 'tools/patch_live_media.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_live_media.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/live_workout_screen.dart
          git rm tools/patch_live_media.py .github/workflows/patch-live-media.yml
          git commit -m "Use universal exercise media in live workouts"
          git push
