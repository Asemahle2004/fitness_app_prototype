name: One-time member home patch

on:
  push:
    paths:
      - '.github/workflows/patch-member-home.yml'
      - 'tools/patch_member_home_and_account.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch member flow
        run: python tools/patch_member_home_and_account.py

      - name: Commit patch and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/account_screen.dart
          git rm tools/patch_member_home_and_account.py .github/workflows/patch-member-home.yml
          git commit -m "Skip repeat onboarding and edit saved training profile"
          git push
