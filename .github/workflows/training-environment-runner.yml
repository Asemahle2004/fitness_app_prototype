name: Run training environment integration

on:
  push:
    branches: [feature/training-environment-switch]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[environment-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/training-environment-switch
      - name: Extract and run integration script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/training-environment-patch.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = workflow[start:end]
          lines = []
          for line in script.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/environment_patch.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/environment_patch.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/live_workout_screen.dart lib/training_environment_engine.dart test/training_environment_engine_test.dart
          git commit -m "Integrate training environment switching [environment-patch]"
          git push origin HEAD:feature/training-environment-switch
