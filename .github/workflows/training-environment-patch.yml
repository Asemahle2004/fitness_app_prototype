name: Training environment switch patch

on:
  push:
    branches: [feature/training-environment-switch]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[environment-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/training-environment-switch
      - name: Patch environment switching into LeanIt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Expected snippet not found: {label}')
              return text.replace(old, new, 1)

          main_path = Path('lib/main.dart')
          text = main_path.read_text()
          text = replace_once(
              text,
              "import 'member_shell.dart';\n",
              "import 'member_shell.dart';\nimport 'training_environment_engine.dart';\n",
              'main import',
          )
          text = replace_once(
              text,
              "class _WorkoutDetailScreenState extends State<WorkoutDetailScreen> {\n  late String selectedLocation;\n  List<ExercisePrescription>? customExercises;",
              "class _WorkoutDetailScreenState extends State<WorkoutDetailScreen> {\n  late String selectedLocation;\n  late final String originalLocation;\n  late Set<String> todayHomeEquipment;\n  String? todayGymAccess;\n  List<ExercisePrescription>? customExercises;",
              'detail fields',
          )
          text = replace_once(
              text,
              "    } else {\n      selectedLocation = 'Outside';\n    }\n  }\n\n  @override\n  Widget build(BuildContext context) {",
              "    } else {\n      selectedLocation = 'Outside';\n    }\n    originalLocation = selectedLocation;\n    todayHomeEquipment = Set<String>.from(widget.homeEquipment);\n    todayGymAccess = widget.gymAccess;\n  }\n\n  Future<void> _chooseHomeEquipmentForToday() async {\n    const options = <String>[\n      'Bodyweight only',\n      'Dumbbells',\n      'Resistance bands',\n      'Pull-up bar',\n      'Bench',\n      'Barbell',\n      'Weight plates',\n      'Kettlebell',\n      'Skipping rope',\n    ];\n    final working = todayHomeEquipment.isEmpty\n        ? <String>{'Bodyweight only'}\n        : Set<String>.from(todayHomeEquipment);\n    final result = await showModalBottomSheet<Set<String>>(\n      context: context,\n      isScrollControlled: true,\n      showDragHandle: true,\n      builder: (sheetContext) => StatefulBuilder(\n        builder: (context, setSheetState) => SafeArea(\n          child: Padding(\n            padding: const EdgeInsets.fromLTRB(20, 4, 20, 24),\n            child: Column(\n              mainAxisSize: MainAxisSize.min,\n              crossAxisAlignment: CrossAxisAlignment.start,\n              children: [\n                const Text(\n                  'What can you use at home today?',\n                  style: TextStyle(\n                    fontSize: 22,\n                    fontWeight: FontWeight.bold,\n                    color: Color(0xFF102A43),\n                  ),\n                ),\n                const SizedBox(height: 8),\n                const Text(\n                  'This changes today’s session only. Your saved equipment profile stays unchanged.',\n                  style: TextStyle(color: Color(0xFF627D98)),\n                ),\n                const SizedBox(height: 14),\n                Flexible(\n                  child: SingleChildScrollView(\n                    child: Wrap(\n                      spacing: 8,\n                      runSpacing: 8,\n                      children: options.map((item) {\n                        final selected = working.contains(item);\n                        return FilterChip(\n                          label: Text(item),\n                          selected: selected,\n                          onSelected: (_) {\n                            setSheetState(() {\n                              if (item == 'Bodyweight only') {\n                                working\n                                  ..clear()\n                                  ..add('Bodyweight only');\n                              } else {\n                                working.remove('Bodyweight only');\n                                if (selected) {\n                                  working.remove(item);\n                                } else {\n                                  working.add(item);\n                                }\n                                if (working.isEmpty) {\n                                  working.add('Bodyweight only');\n                                }\n                              }\n                            });\n                          },\n                        );\n                      }).toList(),\n                    ),\n                  ),\n                ),\n                const SizedBox(height: 18),\n                SizedBox(\n                  width: double.infinity,\n                  child: ElevatedButton(\n                    onPressed: () => Navigator.pop(\n                      sheetContext,\n                      Set<String>.from(working),\n                    ),\n                    child: const Text('USE THIS EQUIPMENT TODAY'),\n                  ),\n                ),\n              ],\n            ),\n          ),\n        ),\n      ),\n    );\n    if (!mounted || result == null) return;\n    setState(() {\n      todayHomeEquipment = result;\n      customExercises = null;\n    });\n  }\n\n  Future<void> _chooseGymAccessForToday() async {\n    final result = await showModalBottomSheet<String>(\n      context: context,\n      showDragHandle: true,\n      builder: (sheetContext) => SafeArea(\n        child: Padding(\n          padding: const EdgeInsets.fromLTRB(20, 4, 20, 20),\n          child: Column(\n            mainAxisSize: MainAxisSize.min,\n            crossAxisAlignment: CrossAxisAlignment.start,\n            children: [\n              const Text(\n                'What gym setup do you have today?',\n                style: TextStyle(\n                  fontSize: 22,\n                  fontWeight: FontWeight.bold,\n                  color: Color(0xFF102A43),\n                ),\n              ),\n              const SizedBox(height: 8),\n              const Text(\n                'This is a today-only choice and does not change your account profile.',\n                style: TextStyle(color: Color(0xFF627D98)),\n              ),\n              const SizedBox(height: 10),\n              for (final option in const ['Full gym', 'Basic gym', \"I'm not sure\"])\n                ListTile(\n                  contentPadding: EdgeInsets.zero,\n                  leading: const Icon(Icons.fitness_center_outlined),\n                  title: Text(option),\n                  trailing: todayGymAccess == option\n                      ? const Icon(Icons.check_circle, color: Color(0xFF176B87))\n                      : null,\n                  onTap: () => Navigator.pop(sheetContext, option),\n                ),\n            ],\n          ),\n        ),\n      ),\n    );\n    if (!mounted || result == null) return;\n    setState(() {\n      todayGymAccess = result;\n      customExercises = null;\n    });\n  }\n\n  Future<void> _chooseTrainingEnvironment() async {\n    final result = await showModalBottomSheet<String>(\n      context: context,\n      showDragHandle: true,\n      builder: (sheetContext) => SafeArea(\n        child: Padding(\n          padding: const EdgeInsets.fromLTRB(20, 4, 20, 20),\n          child: Column(\n            mainAxisSize: MainAxisSize.min,\n            crossAxisAlignment: CrossAxisAlignment.start,\n            children: [\n              const Text(\n                'Where are you training today?',\n                style: TextStyle(\n                  fontSize: 22,\n                  fontWeight: FontWeight.bold,\n                  color: Color(0xFF102A43),\n                ),\n              ),\n              const SizedBox(height: 8),\n              const Text(\n                'LeanIt will rebuild this session for the new environment without changing your permanent programme profile.',\n                style: TextStyle(color: Color(0xFF627D98)),\n              ),\n              const SizedBox(height: 10),\n              ListTile(\n                contentPadding: EdgeInsets.zero,\n                leading: const Icon(Icons.fitness_center),\n                title: const Text('Gym'),\n                onTap: () => Navigator.pop(sheetContext, 'Gym'),\n              ),\n              ListTile(\n                contentPadding: EdgeInsets.zero,\n                leading: const Icon(Icons.home_rounded),\n                title: const Text('Home'),\n                onTap: () => Navigator.pop(sheetContext, 'Home'),\n              ),\n              ListTile(\n                contentPadding: EdgeInsets.zero,\n                leading: const Icon(Icons.directions_run),\n                title: const Text('Outside'),\n                onTap: () => Navigator.pop(sheetContext, 'Outside'),\n              ),\n            ],\n          ),\n        ),\n      ),\n    );\n    if (!mounted || result == null) return;\n    setState(() {\n      selectedLocation = result;\n      customExercises = null;\n    });\n    if (result == 'Home' && todayHomeEquipment.isEmpty) {\n      await _chooseHomeEquipmentForToday();\n    } else if (result == 'Gym' && todayGymAccess == null) {\n      await _chooseGymAccessForToday();\n    }\n  }\n\n  @override\n  Widget build(BuildContext context) {",
              'detail init and helpers',
          )
          old_generate = """    final generatedWorkout = WorkoutEngine.generate(\n      sessionTitle: widget.session.title,\n      location: selectedLocation,\n      homeEquipment: widget.homeEquipment,\n      gymAccess: widget.gymAccess,\n      sessionDuration: widget.session.duration,\n    );"""
          new_generate = """    final generatedWorkout = TrainingEnvironmentEngine.generate(\n      sessionTitle: widget.session.title,\n      environment: selectedLocation,\n      savedHomeEquipment: widget.homeEquipment,\n      todayHomeEquipment: todayHomeEquipment,\n      gymAccess: todayGymAccess,\n      sessionDuration: widget.session.duration,\n    );\n    final originalGeneratedWorkout = TrainingEnvironmentEngine.generate(\n      sessionTitle: widget.session.title,\n      environment: originalLocation,\n      savedHomeEquipment: widget.homeEquipment,\n      gymAccess: widget.gymAccess,\n      sessionDuration: widget.session.duration,\n    );\n    final environmentSummary = TrainingEnvironmentEngine.compare(\n      original: originalGeneratedWorkout,\n      originalEnvironment: originalLocation,\n      adapted: generatedWorkout,\n      adaptedEnvironment: selectedLocation,\n    );"""
          text = replace_once(text, old_generate, new_generate, 'workout generation')

          start = text.find("                    if (widget.locations.length > 1) ...[")
          end = text.find("                    if (adaptation.status != SafetyStatus", start)
          if start < 0 or end < 0:
              raise SystemExit('environment choice block markers not found')
          new_block = """                    const Text(\n                      'Training setup today',\n                      style: TextStyle(\n                        fontSize: 18,\n                        fontWeight: FontWeight.bold,\n                        color: Color(0xFF102A43),\n                      ),\n                    ),\n                    const SizedBox(height: 6),\n                    const Text(\n                      'Plans change. Choose where you are actually training today and LeanIt will rebuild this session around that environment.',\n                      style: TextStyle(\n                        fontSize: 14,\n                        height: 1.4,\n                        color: Color(0xFF627D98),\n                      ),\n                    ),\n                    const SizedBox(height: 12),\n                    Wrap(\n                      spacing: 10,\n                      runSpacing: 10,\n                      children: TrainingEnvironmentEngine.environments.map(\n                        (location) => ChoiceChip(\n                          avatar: Icon(\n                            location == 'Home'\n                                ? Icons.home_rounded\n                                : location == 'Outside'\n                                    ? Icons.directions_run\n                                    : Icons.fitness_center,\n                            size: 18,\n                          ),\n                          label: Text(location),\n                          selected: selectedLocation == location,\n                          onSelected: (_) async {\n                            if (selectedLocation == location) return;\n                            setState(() {\n                              selectedLocation = location;\n                              customExercises = null;\n                            });\n                            if (location == 'Home' && todayHomeEquipment.isEmpty) {\n                              await _chooseHomeEquipmentForToday();\n                            } else if (location == 'Gym' && todayGymAccess == null) {\n                              await _chooseGymAccessForToday();\n                            }\n                          },\n                        ),\n                      ).toList(),\n                    ),\n                    const SizedBox(height: 12),\n                    Container(\n                      width: double.infinity,\n                      padding: const EdgeInsets.all(14),\n                      decoration: BoxDecoration(\n                        color: environmentSummary.changed\n                            ? const Color(0xFFEAF7FA)\n                            : const Color(0xFFF7F9FC),\n                        borderRadius: BorderRadius.circular(16),\n                        border: Border.all(color: const Color(0xFFD9E2EC)),\n                      ),\n                      child: Row(\n                        crossAxisAlignment: CrossAxisAlignment.start,\n                        children: [\n                          Icon(\n                            environmentSummary.changed\n                                ? Icons.swap_horiz_rounded\n                                : Icons.check_circle_outline,\n                            color: const Color(0xFF176B87),\n                          ),\n                          const SizedBox(width: 10),\n                          Expanded(\n                            child: Column(\n                              crossAxisAlignment: CrossAxisAlignment.start,\n                              children: [\n                                Text(\n                                  environmentSummary.headline,\n                                  style: const TextStyle(\n                                    fontWeight: FontWeight.bold,\n                                    color: Color(0xFF102A43),\n                                  ),\n                                ),\n                                const SizedBox(height: 4),\n                                Text(\n                                  environmentSummary.explanation,\n                                  style: const TextStyle(\n                                    fontSize: 13,\n                                    height: 1.4,\n                                    color: Color(0xFF627D98),\n                                  ),\n                                ),\n                                if (!widget.locations.contains(selectedLocation)) ...[\n                                  const SizedBox(height: 4),\n                                  const Text(\n                                    'Today-only switch — your saved training-location profile is unchanged.',\n                                    style: TextStyle(\n                                      fontSize: 12,\n                                      color: Color(0xFF176B87),\n                                    ),\n                                  ),\n                                ],\n                              ],\n                            ),\n                          ),\n                        ],\n                      ),\n                    ),\n                    if (selectedLocation == 'Home') ...[\n                      const SizedBox(height: 10),\n                      SizedBox(\n                        width: double.infinity,\n                        child: OutlinedButton.icon(\n                          onPressed: _chooseHomeEquipmentForToday,\n                          icon: const Icon(Icons.home_repair_service_outlined),\n                          label: Text(\n                            todayHomeEquipment.isEmpty\n                                ? 'HOME TODAY: BODYWEIGHT ONLY'\n                                : 'HOME EQUIPMENT TODAY (${todayHomeEquipment.length})',\n                          ),\n                        ),\n                      ),\n                    ],\n                    if (selectedLocation == 'Gym') ...[\n                      const SizedBox(height: 10),\n                      SizedBox(\n                        width: double.infinity,\n                        child: OutlinedButton.icon(\n                          onPressed: _chooseGymAccessForToday,\n                          icon: const Icon(Icons.fitness_center_outlined),\n                          label: Text('GYM TODAY: ${todayGymAccess ?? \"I'M NOT SURE\"}'),\n                        ),\n                      ),\n                    ],\n                    const SizedBox(height: 24),\n\n"""
          text = text[:start] + new_block + text[end:]

          old_start = """                  onPressed: adaptation.blocksTraining\n                      ? null\n                      : () {\n                          Navigator.push(\n                            context,\n                            MaterialPageRoute(\n                              builder: (context) => LiveWorkoutScreen(\n                                workout: workout,\n                              ),\n                            ),\n                          );\n                        },"""
          new_start = """                  onPressed: adaptation.blocksTraining\n                      ? null\n                      : () async {\n                          final result = await Navigator.push<String>(\n                            context,\n                            MaterialPageRoute(\n                              builder: (context) => LiveWorkoutScreen(\n                                workout: workout,\n                                trainingEnvironment: selectedLocation,\n                              ),\n                            ),\n                          );\n                          if (!mounted) return;\n                          if (result == 'changeTrainingEnvironment') {\n                            await _chooseTrainingEnvironment();\n                          }\n                        },"""
          text = replace_once(text, old_start, new_start, 'start workout navigation')
          main_path.write_text(text)

          live_path = Path('lib/live_workout_screen.dart')
          live = live_path.read_text()
          live = replace_once(
              live,
              "class LiveWorkoutScreen extends StatefulWidget {\n  final GeneratedWorkout workout;\n\n  const LiveWorkoutScreen({\n    super.key,\n    required this.workout,\n  });",
              "class LiveWorkoutScreen extends StatefulWidget {\n  final GeneratedWorkout workout;\n  final String? trainingEnvironment;\n\n  const LiveWorkoutScreen({\n    super.key,\n    required this.workout,\n    this.trainingEnvironment,\n  });",
              'live constructor',
          )
          live = replace_once(
              live,
              "  bool get canEditStructure =>\n      phase == LivePhase.ready &&\n      currentIndex == 0 &&\n      currentSet == 1 &&\n      completedSets == 0 &&\n      !_preparationCompleted;",
              "  bool get canEditStructure =>\n      phase == LivePhase.ready &&\n      currentIndex == 0 &&\n      currentSet == 1 &&\n      completedSets == 0 &&\n      !_preparationCompleted;\n\n  bool get canChangeTrainingEnvironment =>\n      phase == LivePhase.ready &&\n      currentIndex == 0 &&\n      currentSet == 1 &&\n      completedSets == 0 &&\n      !inDropSet;",
              'live change environment getter',
          )
          live = replace_once(
              live,
              "  String _environmentForWorkout() {\n    final title = widget.workout.title.toLowerCase();",
              "  String _environmentForWorkout() {\n    final explicit = widget.trainingEnvironment?.toLowerCase();\n    if (explicit != null) {\n      if (explicit.contains('home')) return 'Home';\n      if (explicit.contains('outside')) return 'Outside';\n      if (explicit.contains('gym')) return 'Gym';\n    }\n    final title = widget.workout.title.toLowerCase();",
              'live explicit environment',
          )
          marker = """          if (canEditStructure) const SizedBox(height: 10),\n          if (phase == LivePhase.ready && currentSet == 1 && !inDropSet) ...["""
          insertion = """          if (canEditStructure) const SizedBox(height: 10),\n          if (canChangeTrainingEnvironment)\n            SizedBox(\n              width: double.infinity,\n              child: OutlinedButton.icon(\n                onPressed: _editingWorkout || _swapping || _equipmentAdapting\n                    ? null\n                    : () => Navigator.pop(\n                          context,\n                          'changeTrainingEnvironment',\n                        ),\n                icon: const Icon(Icons.location_on_outlined),\n                style: OutlinedButton.styleFrom(\n                  minimumSize: const Size.fromHeight(50),\n                ),\n                label: Text('CHANGE TRAINING LOCATION • $_trainingEnvironment'),\n              ),\n            ),\n          if (canChangeTrainingEnvironment) const SizedBox(height: 10),\n          if (phase == LivePhase.ready && currentSet == 1 && !inDropSet) ...["""
          live = replace_once(live, marker, insertion, 'live environment button')
          live_path.write_text(live)
          PY
      - name: Format changed Dart files
        run: dart format lib/main.dart lib/live_workout_screen.dart lib/training_environment_engine.dart test/training_environment_engine_test.dart
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/live_workout_screen.dart lib/training_environment_engine.dart test/training_environment_engine_test.dart
          git commit -m "Integrate training environment switching [environment-patch]"
          git push origin HEAD:feature/training-environment-switch
