name: Apply visible LeanIt brand patch

on:
  push:
    branches:
      - feature/offline-first-foundation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[leanit-visible-brand-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/offline-first-foundation
          fetch-depth: 0

      - name: Apply visible branding
        run: python tools/apply_leanit_visible_brand_patch.py

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No visible brand changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/today_dashboard.dart lib/account_screen.dart
          git commit -m "Use LeanIt in visible app branding [leanit-visible-brand-applied]"
          git push origin HEAD:feature/offline-first-foundation
