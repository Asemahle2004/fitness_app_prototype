name: Apply exercise metadata offline cache patch

on:
  push:
    branches:
      - feature/offline-first-foundation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[exercise-offline-cache-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/offline-first-foundation
          fetch-depth: 0

      - name: Apply metadata cache patch
        run: python tools/apply_exercise_metadata_offline_cache_patch.py

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No metadata cache changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/exercise_repository.dart
          git commit -m "Cache exercise metadata for offline use [exercise-offline-cache-applied]"
          git push origin HEAD:feature/offline-first-foundation
