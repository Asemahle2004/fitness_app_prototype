name: Apply progression live patch

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply_progression_live_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Live Workout progressive overload UI
        run: python tools/apply_progression_live_patch.py
      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/live_workout_screen.dart
          git commit -m "Show progressive overload targets in live workouts"
          git push
