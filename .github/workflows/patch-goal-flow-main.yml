name: One-time goal flow main patch

on:
  push:
    paths:
      - '.github/workflows/patch-goal-flow-main.yml'
      - 'tools/patch_goal_flow_main.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch main.dart
        run: python tools/patch_goal_flow_main.py

      - name: Commit patch and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git rm tools/patch_goal_flow_main.py .github/workflows/patch-goal-flow-main.yml
          git commit -m "Wire goal profiles into workout generation"
          git push
