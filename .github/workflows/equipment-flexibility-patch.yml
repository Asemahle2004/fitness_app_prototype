name: Equipment flexibility patch

on:
  push:
    branches: [feature/equipment-flexibility]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[equipment-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/equipment-flexibility
      - name: Patch LeanIt equipment flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected snippet not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          swap = 'lib/exercise_swap_service.dart'
          replace_once(swap,
          '''    required List<ExercisePrescription> sessionExercises,\n    required ExerciseSwapReason reason,\n  }) async {''',
          '''    required List<ExercisePrescription> sessionExercises,\n    required ExerciseSwapReason reason,\n    Set<String> unavailableEquipment = const {},\n  }) async {''')

          replace_once(swap,
          '''        candidate: candidate,\n        reason: reason,\n      )) {''',
          '''        candidate: candidate,\n        reason: reason,\n        unavailableEquipment: unavailableEquipment,\n      )) {''')

          replace_once(swap,
          '''        reason: reason,\n        homeEquipment: homeEquipment,\n        gymAccess: gymAccess,\n      );''',
          '''        reason: reason,\n        unavailableEquipment: unavailableEquipment,\n        homeEquipment: homeEquipment,\n        gymAccess: gymAccess,\n      );''')

          replace_once(swap,
          '''    required OnlineExercise candidate,\n    required ExerciseSwapReason reason,\n  }) {''',
          '''    required OnlineExercise candidate,\n    required ExerciseSwapReason reason,\n    Set<String> unavailableEquipment = const {},\n  }) {''')

          replace_once(swap,
          '''    if (reason == ExerciseSwapReason.equipmentUnavailable) {\n      final currentEquipment =\n          _normaliseEquipment('${current.equipment} ${current.name}');\n      final candidateEquipment = _normaliseEquipment(\n        '${candidate.equipment.join(' ')} ${candidate.name}',\n      );\n      final unavailableOverlap =\n          candidateEquipment.intersection(currentEquipment)\n            ..remove('bodyweight');\n      if (unavailableOverlap.isNotEmpty) return false;\n    }''',
          '''    if (reason == ExerciseSwapReason.equipmentUnavailable) {\n      final currentEquipment =\n          _normaliseEquipment('${current.equipment} ${current.name}');\n      final candidateEquipment = _normaliseEquipment(\n        '${candidate.equipment.join(' ')} ${candidate.name}',\n      );\n      if (unavailableEquipment.isNotEmpty) {\n        final blocked = candidateEquipment.intersection(unavailableEquipment)\n          ..remove('bodyweight');\n        if (blocked.isNotEmpty) return false;\n      } else {\n        final unavailableOverlap =\n            candidateEquipment.intersection(currentEquipment)\n              ..remove('bodyweight');\n        if (unavailableOverlap.isNotEmpty) return false;\n      }\n    }''')

          replace_once(swap,
          '''    required OnlineExercise candidate,\n    required ExerciseSwapReason reason,\n    Set<String> homeEquipment = const {},''',
          '''    required OnlineExercise candidate,\n    required ExerciseSwapReason reason,\n    Set<String> unavailableEquipment = const {},\n    Set<String> homeEquipment = const {},''')

          replace_once(swap,
          '''      if (candidateEquipment.intersection(currentEquipment).isEmpty) {\n        score += 8;\n        why.add('different equipment');\n      }''',
          '''      if (unavailableEquipment.isNotEmpty) {\n        if (candidateEquipment.intersection(unavailableEquipment).isEmpty) {\n          score += 8;\n          why.add('avoids unavailable equipment');\n        }\n      } else if (candidateEquipment.intersection(currentEquipment).isEmpty) {\n        score += 8;\n        why.add('different equipment');\n      }''')

          replace_once(swap,
          '''    if (text.contains('machine')) result.add('machine');\n    if (text.contains('pull-up') || text.contains('pull up')) result.add('pullupbar');''',
          '''    if (text.contains('leg press')) result.add('leg press machine');\n    if (text.contains('lat pulldown')) result.add('lat pulldown machine');\n    if (text.contains('treadmill')) result.add('treadmill');\n    if (text.contains('bike') || text.contains('cycle')) result.add('bike');\n    if (text.contains('machine')) result.add('machine');\n    if (text.contains('pull-up') || text.contains('pull up')) result.add('pullupbar');''')

          live = 'lib/live_workout_screen.dart'
          replace_once(live,
          '''import 'drop_set_engine.dart';\nimport 'exercise_media.dart';''',
          '''import 'drop_set_engine.dart';\nimport 'equipment_availability_store.dart';\nimport 'equipment_flexibility_engine.dart';\nimport 'exercise_media.dart';''')

          replace_once(live,
          '''  bool _openingCoolDown = false;\n  int? _nextIndexAfterRest;''',
          '''  bool _openingCoolDown = false;\n  bool _equipmentPromptOpen = false;\n  bool _equipmentAdapting = false;\n  bool _finishedWithoutExercises = false;\n  int? _nextIndexAfterRest;''')

          replace_once(live,
          '''  late final ExercisePerformanceStore _performanceStore;\n  late final ExerciseSwapService _swapService;''',
          '''  late final ExercisePerformanceStore _performanceStore;\n  late final ExerciseSwapService _swapService;\n  late final EquipmentAvailabilityStore _equipmentStore;\n  late final String _trainingEnvironment;\n  final Map<String, Set<String>> _deferredEquipmentByExercise = {};''')

          replace_once(live,
          '''  bool get isComplete =>\n      _sessionExercises.isNotEmpty &&\n      completedExercises >= _sessionExercises.length;''',
          '''  bool get isComplete =>\n      _finishedWithoutExercises ||\n      (_sessionExercises.isNotEmpty &&\n          completedExercises >= _sessionExercises.length);''')

          replace_once(live,
          '''    _performanceStore = ExercisePerformanceStore(client);\n    _swapService = ExerciseSwapService(client);\n\n    if (_sessionExercises.isNotEmpty) {''',
          '''    _performanceStore = ExercisePerformanceStore(client);\n    _swapService = ExerciseSwapService(client);\n    _trainingEnvironment = _environmentForWorkout();\n    _equipmentStore = EquipmentAvailabilityStore(\n      userScope: client.auth.currentUser?.id ?? 'guest',\n    );\n\n    if (_sessionExercises.isNotEmpty) {''')

          replace_once(live,
          '''      unawaited(_loadPreviousPerformance(currentExercise.name));\n    }\n\n    _workoutTimer = Timer.periodic''',
          '''      unawaited(_loadPreviousPerformance(currentExercise.name));\n      unawaited(_applyRememberedEquipmentAvailability());\n    }\n\n    _workoutTimer = Timer.periodic''')

          replace_once(live,
          '''  void _startSet() {\n    if (_editingWorkout || _swapping) return;''',
          '''  void _startSet() {\n    if (_editingWorkout || _swapping || _equipmentAdapting) return;''')

          insert_before_swap = '''  Future<void> _openSwapFlow() async {'''
          equipment_methods = r'''  String _environmentForWorkout() {
    final title = widget.workout.title.toLowerCase();
    if (title.contains('home')) return 'Home';
    if (title.contains('outside')) return 'Outside';
    return 'Gym';
  }

  Future<void> _applyRememberedEquipmentAvailability() async {
    if (_sessionExercises.isEmpty || completedSets > 0 || !mounted) return;
    final unavailable =
        await _equipmentStore.unavailableFor(_trainingEnvironment);
    if (!mounted || unavailable.isEmpty || completedSets > 0) return;

    setState(() => _equipmentAdapting = true);
    var changed = 0;
    for (var index = 0; index < _sessionExercises.length; index += 1) {
      final exercise = _sessionExercises[index];
      if (exercise.supersetId != null ||
          !EquipmentFlexibilityEngine.exerciseUsesAny(
            exercise,
            unavailable,
          )) {
        continue;
      }
      try {
        final result = await _swapService.suggestions(
          current: exercise,
          sessionExercises: _sessionExercises,
          reason: ExerciseSwapReason.equipmentUnavailable,
          unavailableEquipment: unavailable,
        );
        if (result.suggestions.isEmpty) continue;
        var replacement = result.suggestions.first.exercise.copyWith(
          supersetId: exercise.supersetId,
        );
        if (exercise.dropSetCount > 0 &&
            DropSetEngine.canConfigure(replacement)) {
          replacement = replacement.copyWith(
            dropSetCount: exercise.dropSetCount,
            dropSetReductionPercent: exercise.dropSetReductionPercent,
          );
        }
        _sessionExercises[index] = replacement;
        changed += 1;
      } catch (_) {
        // A remembered-equipment adaptation must never block the workout.
      }
    }

    if (!mounted) return;
    setState(() {
      _equipmentAdapting = false;
      if (_sessionExercises.isNotEmpty) {
        _resetCurrentExerciseState(
          setNumber: _completedSetsByExercise[currentIndex] + 1,
        );
      }
    });
    if (_sessionExercises.isNotEmpty) {
      unawaited(_loadPreviousPerformance(currentExercise.name));
    }
    if (changed > 0 && mounted) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(
          content: Text(
            'LeanIt adjusted $changed exercise${changed == 1 ? '' : 's'} for equipment remembered at $_trainingEnvironment.',
          ),
        ),
      );
    }
  }

  Future<EquipmentIssueType?> _selectEquipmentIssueType() {
    return showModalBottomSheet<EquipmentIssueType>(
      context: context,
      showDragHandle: true,
      builder: (sheetContext) => SafeArea(
        child: Padding(
          padding: const EdgeInsets.fromLTRB(20, 4, 20, 20),
          child: Column(
            mainAxisSize: MainAxisSize.min,
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              const Text(
                'What is happening with the equipment?',
                style: TextStyle(
                  fontSize: 22,
                  fontWeight: FontWeight.bold,
                  color: Color(0xFF102A43),
                ),
              ),
              const SizedBox(height: 8),
              const Text(
                'LeanIt treats a busy station differently from equipment that does not exist here.',
                style: TextStyle(color: Color(0xFF627D98)),
              ),
              const SizedBox(height: 12),
              ListTile(
                contentPadding: EdgeInsets.zero,
                leading: const Icon(Icons.hourglass_top_rounded),
                title: const Text('Temporarily occupied'),
                subtitle: const Text('Someone is using it right now.'),
                onTap: () => Navigator.pop(
                  sheetContext,
                  EquipmentIssueType.temporarilyOccupied,
                ),
              ),
              ListTile(
                contentPadding: EdgeInsets.zero,
                leading: const Icon(Icons.location_off_outlined),
                title: Text(
                  _trainingEnvironment == 'Gym'
                      ? 'This gym does not have it'
                      : 'Not available at this location',
                ),
                subtitle: const Text('Remember this for future sessions here.'),
                onTap: () => Navigator.pop(
                  sheetContext,
                  EquipmentIssueType.unavailableAtLocation,
                ),
              ),
              ListTile(
                contentPadding: EdgeInsets.zero,
                leading: const Icon(Icons.today_outlined),
                title: const Text('Not available today'),
                subtitle: const Text('Change only today’s workout.'),
                onTap: () => Navigator.pop(
                  sheetContext,
                  EquipmentIssueType.unavailableToday,
                ),
              ),
            ],
          ),
        ),
      ),
    );
  }

  Future<Set<String>?> _selectUnavailableEquipment() async {
    final components = EquipmentFlexibilityEngine.components(
      '${currentExercise.equipment} + ${currentExercise.name}',
    );
    if (components.isEmpty) return const <String>{};
    if (components.length == 1) return {components.first};

    return showModalBottomSheet<Set<String>>(
      context: context,
      showDragHandle: true,
      builder: (sheetContext) => SafeArea(
        child: Padding(
          padding: const EdgeInsets.fromLTRB(20, 4, 20, 20),
          child: Column(
            mainAxisSize: MainAxisSize.min,
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              const Text(
                'Which part is unavailable?',
                style: TextStyle(
                  fontSize: 22,
                  fontWeight: FontWeight.bold,
                  color: Color(0xFF102A43),
                ),
              ),
              const SizedBox(height: 8),
              const Text(
                'Choosing the exact item helps LeanIt keep equipment that is still usable.',
                style: TextStyle(color: Color(0xFF627D98)),
              ),
              const SizedBox(height: 12),
              ...components.map(
                (item) => ListTile(
                  contentPadding: EdgeInsets.zero,
                  leading: const Icon(Icons.fitness_center_outlined),
                  title: Text(EquipmentFlexibilityEngine.labelForToken(item)),
                  onTap: () => Navigator.pop(sheetContext, {item}),
                ),
              ),
              ListTile(
                contentPadding: EdgeInsets.zero,
                leading: const Icon(Icons.block_outlined),
                title: const Text('The whole setup'),
                onTap: () => Navigator.pop(sheetContext, components),
              ),
            ],
          ),
        ),
      ),
    );
  }

  Future<void> _openEquipmentFlow() async {
    if (_swapping ||
        _editingWorkout ||
        _equipmentAdapting ||
        phase != LivePhase.ready ||
        currentSet != 1 ||
        inDropSet) {
      return;
    }

    final issue = await _selectEquipmentIssueType();
    if (issue == null || !mounted) return;
    final unavailable = await _selectUnavailableEquipment();
    if (unavailable == null || !mounted) return;

    if (issue == EquipmentIssueType.unavailableAtLocation) {
      await _equipmentStore.markPermanent(_trainingEnvironment, unavailable);
    } else if (issue == EquipmentIssueType.unavailableToday) {
      await _equipmentStore.markToday(_trainingEnvironment, unavailable);
    }
    if (!mounted) return;
    await _openEquipmentActionMenu(issue, unavailable);
  }

  Future<void> _openEquipmentActionMenu(
    EquipmentIssueType issue,
    Set<String> unavailable,
  ) async {
    if (!mounted || _sessionExercises.isEmpty) return;
    final recommendation = EquipmentFlexibilityEngine.recommend(
      issue: issue,
      exercises: _sessionExercises,
      currentIndex: currentIndex,
      unavailable: unavailable,
    );
    final canMove = issue == EquipmentIssueType.temporarilyOccupied &&
        EquipmentFlexibilityEngine.canMoveLater(
          exercises: _sessionExercises,
          currentIndex: currentIndex,
          unavailable: unavailable,
        );

    final action = await showModalBottomSheet<EquipmentSessionAction>(
      context: context,
      showDragHandle: true,
      builder: (sheetContext) => SafeArea(
        child: Padding(
          padding: const EdgeInsets.fromLTRB(20, 4, 20, 20),
          child: Column(
            mainAxisSize: MainAxisSize.min,
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              const Text(
                'Keep the workout moving',
                style: TextStyle(
                  fontSize: 22,
                  fontWeight: FontWeight.bold,
                  color: Color(0xFF102A43),
                ),
              ),
              const SizedBox(height: 8),
              Container(
                width: double.infinity,
                padding: const EdgeInsets.all(12),
                decoration: BoxDecoration(
                  color: const Color(0xFFF3F8DC),
                  borderRadius: BorderRadius.circular(14),
                ),
                child: Text(
                  recommendation == EquipmentSessionAction.moveLater
                      ? 'LeanIt recommends doing another exercise first, then checking this equipment again.'
                      : 'LeanIt recommends a suitable replacement that keeps the main training purpose.',
                  style: const TextStyle(
                    fontWeight: FontWeight.w700,
                    color: Color(0xFF55721B),
                  ),
                ),
              ),
              const SizedBox(height: 10),
              ListTile(
                contentPadding: EdgeInsets.zero,
                leading: const Icon(Icons.swap_horiz_rounded),
                title: const Text('Give me an alternative'),
                trailing: recommendation == EquipmentSessionAction.alternative
                    ? const Chip(label: Text('RECOMMENDED'))
                    : null,
                onTap: () => Navigator.pop(
                  sheetContext,
                  EquipmentSessionAction.alternative,
                ),
              ),
              if (canMove)
                ListTile(
                  contentPadding: EdgeInsets.zero,
                  leading: const Icon(Icons.redo_rounded),
                  title: const Text('Do something else first'),
                  trailing: recommendation == EquipmentSessionAction.moveLater
                      ? const Chip(label: Text('RECOMMENDED'))
                      : null,
                  onTap: () => Navigator.pop(
                    sheetContext,
                    EquipmentSessionAction.moveLater,
                  ),
                ),
              if (currentExercise.supersetId == null)
                ListTile(
                  contentPadding: EdgeInsets.zero,
                  leading: const Icon(Icons.skip_next_rounded),
                  title: const Text('Skip for today'),
                  onTap: () => Navigator.pop(
                    sheetContext,
                    EquipmentSessionAction.skipToday,
                  ),
                ),
            ],
          ),
        ),
      ),
    );

    if (action == null || !mounted) return;
    switch (action) {
      case EquipmentSessionAction.alternative:
        await _openSwapFlow(
          presetReason: ExerciseSwapReason.equipmentUnavailable,
          unavailableEquipment: unavailable,
        );
        break;
      case EquipmentSessionAction.moveLater:
        _moveCurrentExerciseLater(unavailable);
        break;
      case EquipmentSessionAction.skipToday:
        await _skipCurrentExerciseToday();
        break;
    }
  }

  void _moveCurrentExerciseLater(Set<String> unavailable) {
    if (!EquipmentFlexibilityEngine.canMoveLater(
      exercises: _sessionExercises,
      currentIndex: currentIndex,
      unavailable: unavailable,
    )) {
      unawaited(_showSwapMessage('There is no suitable later exercise to do first.'));
      return;
    }

    final fromIndex = currentIndex;
    final targetIndex = EquipmentFlexibilityEngine.moveLaterTargetIndex(
      exercises: _sessionExercises,
      currentIndex: currentIndex,
    );
    final moved = _sessionExercises.removeAt(fromIndex);
    final movedSets = _completedSetsByExercise.removeAt(fromIndex);
    final insertionIndex = targetIndex.clamp(0, _sessionExercises.length);
    _sessionExercises.insert(insertionIndex, moved);
    _completedSetsByExercise.insert(insertionIndex, movedSets);
    _deferredEquipmentByExercise[moved.name] = {...unavailable};

    setState(() {
      currentIndex = fromIndex.clamp(0, _sessionExercises.length - 1);
      _resetCurrentExerciseState(
        setNumber: _completedSetsByExercise[currentIndex] + 1,
      );
    });
    unawaited(_loadPreviousPerformance(currentExercise.name));
    _scheduleDeferredEquipmentCheck();
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(
        content: Text(
          '${moved.name} moved to Exercise ${insertionIndex + 1}. Next: ${currentExercise.name}.',
        ),
      ),
    );
  }

  Future<void> _skipCurrentExerciseToday() async {
    if (currentExercise.supersetId != null) {
      await _showSwapMessage(
        'This exercise is part of a superset. Replace it instead so LeanIt does not break the paired structure.',
      );
      return;
    }
    final skipped = currentExercise.name;
    _deferredEquipmentByExercise.remove(skipped);

    setState(() {
      _sessionExercises.removeAt(currentIndex);
      _completedSetsByExercise.removeAt(currentIndex);
      if (_sessionExercises.isEmpty ||
          completedExercises >= _sessionExercises.length) {
        _finishedWithoutExercises = true;
        phase = LivePhase.ready;
      } else {
        currentIndex = currentIndex.clamp(0, _sessionExercises.length - 1);
        _resetCurrentExerciseState(
          setNumber: _completedSetsByExercise[currentIndex] + 1,
        );
      }
    });

    if (isComplete) {
      unawaited(_saveHistory());
      unawaited(_openCoolDownFlow());
    } else {
      unawaited(_loadPreviousPerformance(currentExercise.name));
      _scheduleDeferredEquipmentCheck();
    }
    if (mounted) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text('$skipped skipped for today.')),
      );
    }
  }

  void _scheduleDeferredEquipmentCheck() {
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (mounted) unawaited(_promptDeferredEquipmentCheck());
    });
  }

  Future<void> _promptDeferredEquipmentCheck() async {
    if (_equipmentPromptOpen ||
        !mounted ||
        isComplete ||
        _sessionExercises.isEmpty ||
        phase != LivePhase.ready ||
        currentSet != 1) {
      return;
    }
    final exerciseName = currentExercise.name;
    final unavailable = _deferredEquipmentByExercise[exerciseName];
    if (unavailable == null) return;

    _equipmentPromptOpen = true;
    final availableNow = await showDialog<bool>(
      context: context,
      barrierDismissible: false,
      builder: (dialogContext) => AlertDialog(
        icon: const Icon(Icons.fitness_center_outlined),
        title: const Text('Is the equipment available now?'),
        content: Text(
          '$exerciseName was moved later because the equipment was occupied.',
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(dialogContext, false),
            child: const Text('STILL OCCUPIED'),
          ),
          FilledButton(
            onPressed: () => Navigator.pop(dialogContext, true),
            child: const Text('YES'),
          ),
        ],
      ),
    );
    _equipmentPromptOpen = false;
    if (!mounted) return;

    _deferredEquipmentByExercise.remove(exerciseName);
    if (availableNow == true) {
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(content: Text('$exerciseName is back in the session.')),
      );
      return;
    }
    await _openEquipmentActionMenu(
      EquipmentIssueType.temporarilyOccupied,
      unavailable,
    );
  }

