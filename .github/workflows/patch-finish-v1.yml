name: One-time LeanIt v1 completion patch

on:
  push:
    paths:
      - '.github/workflows/patch-finish-v1.yml'
      - 'tools/patch_finish_v1.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch LeanIt v1
        run: python tools/patch_finish_v1.py
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/live_workout_screen.dart
          git rm tools/patch_finish_v1.py .github/workflows/patch-finish-v1.yml
          git commit -m "Finish LeanIt v1 progress readiness and history"
          git push
