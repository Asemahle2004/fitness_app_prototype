name: Apply adaptive weekly UI patch

on:
  push:
    branches:
      - feature/adaptive-weekly-programming

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[adaptive-weekly-ui-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/adaptive-weekly-programming
          fetch-depth: 0

      - name: Apply UI patch
        run: python tools/apply_adaptive_weekly_ui_patch.py

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No adaptive weekly UI changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/today_dashboard.dart
          git commit -m "Integrate adaptive weekly session controls [adaptive-weekly-ui-applied]"
          git push origin HEAD:feature/adaptive-weekly-programming
