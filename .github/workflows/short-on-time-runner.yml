name: Run short on time integration

on:
  push:
    branches: [feature/short-on-time]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[short-time-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/short-on-time
      - name: Apply integration patch
        run: python tools/patch_short_on_time.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/short_on_time_engine.dart lib/live_workout_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "[short-time-patch] Integrate short-on-time workout adaptation"
          git push origin feature/short-on-time
