name: Apply running tracking integration

on:
  push:
    branches:
      - feature/running-tracking

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[running-tracking-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/running-tracking
          fetch-depth: 0

      - name: Apply running tracking patch
        run: python tools/apply_running_tracking_patch.py

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No running tracking changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/progress_screen.dart
          git commit -m "Wire running tracking into Progress screen [running-tracking-applied]"
          git push origin HEAD:feature/running-tracking
