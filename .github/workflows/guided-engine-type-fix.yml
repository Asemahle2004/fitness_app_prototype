name: Run guided run type fix

on:
  push:
    branches: [feature/guided-running-intervals]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[guided-engine-type-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guided-running-intervals
      - name: Apply progress type fix
        run: python tools/fix_guided_engine_type.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/guided_run_engine.dart
          if git diff --cached --quiet; then
            echo "No type fix required"
          else
            git commit -m "[guided-engine-type-fix] Fix guided run progress type"
            git push origin feature/guided-running-intervals
          fi
