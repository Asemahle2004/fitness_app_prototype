name: One-time workout structure patch

on:
  push:
    paths:
      - '.github/workflows/patch-workout-structure.yml'
      - 'tools/patch_workout_structure.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.dart
        run: python tools/patch_workout_structure.py
      - name: Commit patch and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git rm tools/patch_workout_structure.py .github/workflows/patch-workout-structure.yml
          git commit -m "Use fuller workout session structure"
          git push
