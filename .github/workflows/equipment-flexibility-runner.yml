name: Run equipment flexibility patch

on:
  push:
    branches: [feature/equipment-flexibility]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/equipment-flexibility
      - name: Extract and run patch script
        shell: bash
        run: |
          python - <<'OUTER'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/equipment-flexibility-patch.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/equipment_patch.py').write_text('\n'.join(body) + '\n')
          subprocess.run(['python', '/tmp/equipment_patch.py'], check=True)
          OUTER
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "[equipment-patch] Integrate equipment availability flow"
          git push origin HEAD:feature/equipment-flexibility
