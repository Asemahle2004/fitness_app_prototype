name: Apply workout calendar integration

on:
  push:
    branches:
      - feature/workout-calendar

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[workout-calendar-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/workout-calendar
          fetch-depth: 0

      - name: Apply workout calendar patch
        run: python tools/apply_workout_calendar_patch.py

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No workout calendar changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/progress_screen.dart
          git commit -m "Wire workout calendar into Progress screen [workout-calendar-applied]"
          git push origin HEAD:feature/workout-calendar
