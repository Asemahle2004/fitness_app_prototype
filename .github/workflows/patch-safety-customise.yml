name: One-time safety and customisation patch

on:
  push:
    paths:
      - '.github/workflows/patch-safety-customise.yml'
      - 'tools/patch_safety_customise.py'
      - 'tools/run_patch_safety_customise.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch main.dart
        run: python tools/run_patch_safety_customise.py

      - name: Commit patch and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git rm tools/patch_safety_customise.py tools/run_patch_safety_customise.py .github/workflows/patch-safety-customise.yml
          git commit -m "Wire injury adaptation visuals and workout customisation"
          git push
