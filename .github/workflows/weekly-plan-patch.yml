name: Run weekly plan integration

on:
  push:
    branches: [feature/missed-workout-adaptation]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[weekly-plan-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/missed-workout-adaptation
      - name: Apply weekly plan integration
        run: python tools/patch_weekly_plan.py
      - name: Commit integration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/main.dart
          if git diff --cached --quiet; then
            echo "No integration changes required"
          else
            git commit -m "[weekly-plan-patch] Integrate adaptive weekly plan"
            git push origin feature/missed-workout-adaptation
          fi
