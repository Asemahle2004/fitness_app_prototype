name: Apply drop set integration

on:
  push:
    branches:
      - feature/drop-sets

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[drop-set-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/drop-sets
          fetch-depth: 0

      - name: Apply drop set patch
        run: python tools/apply_drop_set_patch.py

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No drop-set changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/workout_engine.dart lib/custom_workout_store.dart lib/superset_engine.dart lib/exercise_performance_store.dart lib/workout_editor_screen.dart lib/custom_workouts_screen.dart lib/live_workout_screen.dart
          git commit -m "Apply drop set integration [drop-set-applied]"
          git push origin HEAD:feature/drop-sets
