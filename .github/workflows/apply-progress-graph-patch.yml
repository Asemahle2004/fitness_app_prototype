name: Apply progress graph integration

on:
  push:
    branches:
      - feature/progress-graphs

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[progress-graph-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/progress-graphs
          fetch-depth: 0

      - name: Apply progress graph patch
        run: python tools/apply_progress_graph_patch.py

      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No progress graph changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/progress_screen.dart
          git commit -m "Wire exercise progress graphs into Progress screen [progress-graph-applied]"
          git push origin HEAD:feature/progress-graphs
