name: One-time LeanEat publish shell patch
on:
  push:
    paths:
      - '.github/workflows/patch-publish-shell.yml'
      - 'tools/patch_publish_shell.py'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_publish_shell.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git rm tools/patch_publish_shell.py .github/workflows/patch-publish-shell.yml
          git commit -m "Brand LeanEat and require accounts"
          git push