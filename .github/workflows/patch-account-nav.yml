name: One-time LeanEat account navigation patch

on:
  push:
    paths:
      - '.github/workflows/patch-account-nav.yml'
      - 'tools/patch_account_nav.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.dart
        run: python tools/patch_account_nav.py
      - name: Commit account navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git rm tools/patch_account_nav.py .github/workflows/patch-account-nav.yml
          git commit -m "Wire LeanEat account and analyzer navigation"
          git push
